
name: NSMOD FF NETWORK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout My GitHub
        uses: actions/checkout@v4
        with:
          repository: xuanvumai/NSMOD-FF-Network-2023
          ref: main

      - name: Check Swift
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Project
        run: |
          xcodegen generate

      - name: Check Scheme
        run: |
          xcodebuild -list \
            -project NSMODFFNetwork.xcodeproj

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project NSMODFFNetwork.xcodeproj \
            -scheme NSMODFFNetwork \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
