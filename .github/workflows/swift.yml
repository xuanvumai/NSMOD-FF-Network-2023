
name: NSMOD FF NETWORK - Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check Environment
        run: |
          node --version
          npm --version
          swift --version
          xcodebuild -version

      - name: Verify Source
        run: |
          test -f project.yml
          test -f Sources/NSMODFFNetwork/ContentView.swift
          test -f Sources/NSMODFFNetwork/NSMODFFNetworkApp.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Verify Scheme
        run: |
          xcodebuild -list \
            -project NSMODFFNetwork.xcodeproj

      - name: Archive Unsigned App
        run: |
          xcodebuild \
            -project NSMODFFNetwork.xcodeproj \
            -scheme NSMODFFNetwork \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/NSMODFFNetwork.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA
        run: |
          APP="build/NSMODFFNetwork.xcarchive/Products/Applications/NSMODFFNetwork.app"

          test -d "$APP"

          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/

          cd ipa
          zip -qry ../NSMODFFNetwork-unsigned.ipa Payload

          cd ..
          test -s NSMODFFNetwork-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: NSMODFFNetwork-Unsigned-IPA
          path: NSMODFFNetwork-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
