
name: NSMODFFNetwork

options:
  bundleIdPrefix: com.xuanvumai
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  NSMODFFNetwork:
    type: application
    platform: iOS

    sources:
      - path: Sources/NSMODFFNetwork

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuanvumai.nsmodffnetwork
        PRODUCT_NAME: NSMODFFNetwork
        INFOPLIST_KEY_CFBundleDisplayName: NSMOD FF NETWORK
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
